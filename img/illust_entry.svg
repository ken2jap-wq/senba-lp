<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- HOW IT WORKS ① 応募する：スマホのフォームに入力して送る（2026/9/12） -->
  <defs><style>.jp{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}</style></defs>
  <rect width="400" height="300" fill="#FBF6EE"/>
  <!-- スマホ -->
  <rect x="150" y="34" width="118" height="222" rx="18" fill="#FFFFFF" stroke="#7A2E2A" stroke-width="5"/>
  <rect x="164" y="54" width="90" height="180" rx="8" fill="#F5EBDD"/>
  <rect x="196" y="42" width="26" height="4" rx="2" fill="#7A2E2A"/>
  <!-- フォームの行 -->
  <rect x="174" y="68" width="70" height="8" rx="4" fill="#7A2E2A" opacity=".85"/>
  <rect x="174" y="88" width="70" height="20" rx="4" fill="#FFFFFF" stroke="#C9A78C" stroke-width="1.5"/>
  <rect x="174" y="116" width="70" height="20" rx="4" fill="#FFFFFF" stroke="#C9A78C" stroke-width="1.5"/>
  <rect x="174" y="144" width="70" height="34" rx="4" fill="#FFFFFF" stroke="#C9A78C" stroke-width="1.5"/>
  <!-- チェック -->
  <rect x="174" y="188" width="14" height="14" rx="3" fill="#F1C75B"/>
  <polyline points="177,195 181,199 187,191" fill="none" stroke="#7A2E2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="193" y="192" width="48" height="6" rx="3" fill="#C9A78C"/>
  <!-- 送信ボタン -->
  <rect x="174" y="210" width="70" height="18" rx="9" fill="#B5432E"/>
  <text x="209" y="223" class="jp" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">送信する</text>
  <!-- 鉛筆 -->
  <g transform="rotate(35 300 120)">
    <rect x="284" y="60" width="26" height="110" rx="4" fill="#F1C75B" stroke="#7A2E2A" stroke-width="4"/>
    <polygon points="284,170 310,170 297,196" fill="#F5EBDD" stroke="#7A2E2A" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="292,184 302,184 297,196" fill="#7A2E2A"/>
    <rect x="284" y="52" width="26" height="12" rx="3" fill="#B5432E" stroke="#7A2E2A" stroke-width="4"/>
  </g>
  <!-- 紙飛行機 -->
  <polygon points="52,86 122,60 92,124" fill="#FFFFFF" stroke="#7A2E2A" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="52,86 92,124 86,98" fill="#F1C75B" stroke="#7A2E2A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M40 150 C70 140 80 160 110 150" fill="none" stroke="#7A2E2A" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" opacity=".5"/>
  <!-- キャプション -->
  <text x="200" y="282" class="jp" font-size="13" font-weight="700" fill="#7A2E2A" text-anchor="middle">「やってみたい」を、フォームで送る</text>
</svg>
