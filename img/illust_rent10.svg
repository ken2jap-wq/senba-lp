<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- HOW IT WORKS ③ 売上の10%を払う：売上→10%が家賃（2026/9/12） -->
  <defs><style>.jp{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.en{font-family:"Cormorant Garamond","Times New Roman",serif}</style></defs>
  <rect width="400" height="300" fill="#FBF6EE"/>
  <!-- 左：売上（お札の束） -->
  <g>
    <rect x="46" y="150" width="120" height="58" rx="6" fill="#FFFFFF" stroke="#7A2E2A" stroke-width="4"/>
    <rect x="52" y="134" width="120" height="58" rx="6" fill="#F5EBDD" stroke="#7A2E2A" stroke-width="4"/>
    <rect x="58" y="118" width="120" height="58" rx="6" fill="#FFFFFF" stroke="#7A2E2A" stroke-width="4"/>
    <circle cx="118" cy="147" r="14" fill="#F1C75B" stroke="#7A2E2A" stroke-width="3"/>
    <text x="118" y="152" class="jp" font-size="12" font-weight="700" fill="#7A2E2A" text-anchor="middle">¥</text>
    <text x="118" y="100" class="jp" font-size="14" font-weight="700" fill="#7A2E2A" text-anchor="middle">その月の売上</text>
  </g>
  <!-- 矢印 -->
  <polygon points="196,150 228,150 228,136 254,160 228,184 228,170 196,170" fill="#B5432E"/>
  <!-- 右：10%のコイン -->
  <g>
    <circle cx="316" cy="160" r="52" fill="#F1C75B" stroke="#7A2E2A" stroke-width="5"/>
    <circle cx="316" cy="160" r="40" fill="none" stroke="#7A2E2A" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/>
    <text x="316" y="172" class="en" font-size="36" font-weight="700" fill="#7A2E2A" text-anchor="middle">10%</text>
    <text x="316" y="100" class="jp" font-size="14" font-weight="700" fill="#7A2E2A" text-anchor="middle">家賃</text>
  </g>
  <!-- 補足 -->
  <text x="200" y="250" class="jp" font-size="12.5" fill="#7A2E2A" text-anchor="middle">固定家賃なし。売れた分だけ払う。</text>
  <text x="200" y="272" class="jp" font-size="11" fill="#7A2E2A" opacity=".7" text-anchor="middle">例：月商20万円 → 家賃2万円（共益費は別途 15,000円）</text>
</svg>
